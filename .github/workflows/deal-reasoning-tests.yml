name: Pokémon decision engine — offline tests

on:
  pull_request:
    paths:
      - 'pokemon-detector/**'
      - '.github/workflows/deal-reasoning-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python detector and reasoning unit tests
        run: python -m unittest discover -s pokemon-detector/tests -v
      - name: Dashboard logic tests
        run: node pokemon-detector/tests/page.test.js
