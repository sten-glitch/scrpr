name: Pokémon decision engine — offline tests

on:
  pull_request:
    paths:
      - 'pokemon-detector/**'
      - '.github/workflows/deal-reasoning-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free offline vision dependencies for synthetic image tests
        run: python -m pip install -r pokemon-detector/requirements-local.txt -r pokemon-detector/requirements-deletion.txt
      - name: Python detector, local CV and reasoning unit tests
        run: python -m unittest discover -s pokemon-detector/tests -v
      - name: Dashboard and local-app JavaScript checks
        run: |
          node pokemon-detector/tests/page.test.js
          node --check pokemon-detector/local_app/app.js
          node --check pokemon-detector/photo_review/app.js
          node --check pokemon-detector/local_app/workspace.js
          node --check pokemon-detector/local_app/graded.js
