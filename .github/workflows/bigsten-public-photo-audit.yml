name: BIGSTEN public photo research audit (unlabeled)

# Explicit manual action only. Wikimedia limits requests, and our
# authenticated research must never run on each PR synchronization.
# GitHub workflow_dispatch will become available after the workflow
# is registered on the default branch (once safely merged).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline CV dependencies
        run: python -m pip install -r pokemon-detector/requirements-local.txt
      - name: Public photo audit (ephemeral photos, no paid provider)
        working-directory: pokemon-detector
        run: |
          python public_photo_audit.py --commons 30 --search "pokemon cards" --previews --out private/public_photo_audit
      - name: Explain research metrics
        working-directory: pokemon-detector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("private/public_photo_audit.json").read_text(encoding="utf8"))
          print("Photos successfully processed:",x["summary"]["real_public_photos_processed"])
          print("Provisional rectangle detections:",x["summary"]["provisional_rectangles"])
          print("Failed downloads or scans:",x["summary"]["download_or_analysis_failures"])
          print("Independent card bounding-box precision:",x["summary"]["card_box_precision"])
          print("Actual exact Pokémon printing accuracy:",x["summary"]["real_photo_card_identity_accuracy"])
          assert x["summary"]["real_photo_card_identity_accuracy"] is None
          assert x["summary"]["card_box_precision"] is None
          assert not any("image_base64" in str(c) for c in x["cases"])
          PY
      - name: Upload metadata-only research reports (NO image bytes)
        uses: actions/upload-artifact@v4
        with:
          name: bigsten-public-photo-audit
          path: |
            pokemon-detector/private/public_photo_audit.json
            pokemon-detector/private/public_photo_audit.html
          if-no-files-found: error
          retention-days: 7
